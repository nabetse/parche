<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mapa de la red</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  .rd-wrap *, .rd-wrap *::before, .rd-wrap *::after { box-sizing: border-box; }
  .rd-wrap {
    --papel:#E9EDE4; --papel-alt:#DFE5D8; --tinta:#16241E; --suave:#5C6B5F;
    --verde:#0F7B5A; --naranja:#C9500F; --azul:#2D5FA8;
    font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--tinta); background:var(--papel);
    border-radius:16px; overflow:hidden; position:relative;
    display:flex; flex-direction:column; height:min(84vh,880px); min-height:540px;
    -webkit-text-size-adjust:100%;
  }
  .rd-head { padding:20px 22px 14px; border-bottom:1px solid rgba(22,36,30,.14); flex:none;
    display:flex; justify-content:space-between; align-items:flex-start; gap:16px; }
  .rd-head h2 { margin:0; font-size:clamp(20px,3.2vw,29px); font-weight:600; letter-spacing:-.5px; line-height:1.15; }
  .rd-head p { margin:5px 0 0; font-size:14px; font-weight:300; color:var(--suave); }

  .rd-bar { display:flex; gap:8px; padding:12px 22px; flex-wrap:wrap; align-items:center; flex:none; }
  .rd-bar input {
    font:inherit; font-size:14px; font-weight:300; padding:8px 13px; border-radius:999px;
    border:1.5px solid rgba(22,36,30,.22); background:#fff; color:inherit; min-width:160px; flex:1 1 160px; max-width:280px;
  }
  .rd-bar input:focus { outline:2px solid var(--verde); outline-offset:1px; border-color:transparent; }
  .rd-chip {
    font:inherit; font-size:13px; font-weight:400; padding:7px 14px; border-radius:999px; cursor:pointer;
    border:1.5px solid rgba(22,36,30,.22); background:transparent; color:var(--suave); white-space:nowrap;
  }
  .rd-chip[aria-pressed="true"] { background:var(--tinta); border-color:var(--tinta); color:var(--papel); }
  .rd-chip:focus-visible { outline:2px solid var(--verde); outline-offset:2px; }
  .rd-chip[disabled] { opacity:.45; cursor:default; }

  .rd-medio { display:flex; flex:1 1 auto; min-height:0; }
  .rd-stage { position:relative; flex:1 1 auto; min-width:0; min-height:0; touch-action:none; cursor:grab; }
  .rd-stage.rd-drag { cursor:grabbing; }
  .rd-stage svg { width:100%; height:100%; display:block; }

  .rd-node { cursor:pointer; }
  .rd-node text { pointer-events:none; user-select:none; }
  .rd-fade { opacity:.13; }
  .rd-edge { transition:opacity .18s; }

  .rd-estado { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:30px; font-size:15px; font-weight:300; color:var(--suave); }
  .rd-estado b { display:block; font-weight:500; color:var(--tinta); margin-bottom:6px; font-size:17px; }

  .rd-panel {
    position:absolute; right:14px; top:14px; width:min(310px,calc(100% - 28px));
    background:#fff; border-radius:14px; padding:18px 18px 20px;
    box-shadow:0 10px 34px rgba(22,36,30,.17); max-height:calc(100% - 28px); overflow:auto; display:none;
  }
  .rd-panel.rd-on { display:block; }
  .rd-panel h3 { margin:0 22px 2px 0; font-size:19px; font-weight:600; line-height:1.2; }
  .rd-kind { font-size:12px; font-weight:500; color:var(--suave); margin:0 0 12px; }
  .rd-panel h4 { margin:16px 0 7px; font-size:12px; font-weight:500; color:var(--suave); }
  .rd-panel a { color:var(--azul); }
  .rd-close { position:absolute; top:11px; right:11px; border:0; background:transparent; cursor:pointer;
    font-size:22px; line-height:1; color:var(--suave); padding:4px 7px; border-radius:8px; }
  .rd-close:hover { background:var(--papel-alt); }
  .rd-tags { display:flex; flex-wrap:wrap; gap:5px; }
  .rd-tag { font-size:12px; font-weight:300; padding:4px 9px; border-radius:999px; background:var(--papel-alt); }
  .rd-links { list-style:none; margin:0; padding:0; }
  .rd-links li { font-size:13.5px; font-weight:300; padding:5px 0; border-bottom:1px solid rgba(22,36,30,.09); }
  .rd-links li:last-child { border:0; }
  .rd-links b { font-weight:500; }
  .rd-rel { font-size:11.5px; color:var(--suave); }
  .rd-avisos li { font-size:13px; font-weight:300; margin:0 0 6px; }

  .rd-nube { flex:0 0 228px; border-left:1px solid rgba(22,36,30,.14); display:flex; flex-direction:column; min-height:0; }
  .rd-nube-cab { display:flex; align-items:baseline; justify-content:space-between; gap:8px;
    padding:14px 16px 8px; flex:none; }
  .rd-nube-cab h3 { margin:0; font-size:13px; font-weight:500; }
  .rd-nube-cab button { border:0; background:transparent; font:inherit; font-size:12px; font-weight:300;
    color:var(--azul); cursor:pointer; padding:0; }
  .rd-nube-cab button[hidden] { display:none; }
  .rd-nube-lista { padding:0 16px 16px; overflow:auto; display:flex; flex-wrap:wrap;
    gap:5px; align-content:flex-start; }
  .rd-tema { font:inherit; font-weight:300; line-height:1.25; padding:3px 9px; border-radius:999px;
    border:1px solid rgba(22,36,30,.2); background:transparent; color:var(--tinta); cursor:pointer; }
  .rd-tema:hover { border-color:var(--verde); }
  .rd-tema[aria-pressed="true"] { background:var(--verde); border-color:var(--verde); color:var(--papel); }
  .rd-tema:focus-visible { outline:2px solid var(--verde); outline-offset:2px; }
  .rd-plega { display:none; }

  .rd-web { cursor:pointer; }

  .rd-foot { padding:12px 22px 16px; border-top:1px solid rgba(22,36,30,.14); flex:none;
    display:flex; gap:10px 20px; flex-wrap:wrap; font-size:12.5px; font-weight:300; color:var(--suave); align-items:center; }
  .rd-key { display:flex; align-items:center; gap:7px; }
  .rd-sw { width:26px; height:0; border-top-width:3px; border-top-style:solid; display:block; }
  .rd-dot { width:13px; height:13px; border-radius:50%; background:var(--verde); display:block; }
  .rd-dot.rd-hollow { background:transparent; border:2.5px dashed var(--verde); }
  .rd-box { width:22px; height:15px; border-radius:4px; border:2.5px solid var(--naranja); display:block; }
  .rd-box.rd-ac { border-color:var(--azul); }

  .rd-hint { position:absolute; left:16px; bottom:14px; font-size:12px; font-weight:300; color:var(--suave);
    background:rgba(233,237,228,.88); padding:5px 11px; border-radius:999px; pointer-events:none; }

  @media (max-width:640px) {
    .rd-wrap { height:min(90vh,760px); border-radius:12px; }
    .rd-medio { flex-direction:column; }
    .rd-nube { flex:none; border-left:0; border-top:1px solid rgba(22,36,30,.14); max-height:38%; }
    .rd-nube.rd-cerrada .rd-nube-lista { display:none; }
    .rd-nube.rd-cerrada { max-height:none; }
    .rd-plega { display:inline-block; transition:transform .15s; }
    .rd-nube.rd-cerrada .rd-plega { transform:rotate(-90deg); }
    .rd-nube-cab { cursor:pointer; padding-bottom:12px; }
    .rd-head { flex-direction:column; gap:8px; }
    .rd-head, .rd-bar, .rd-foot { padding-left:15px; padding-right:15px; }
    .rd-panel { right:0; left:0; top:auto; bottom:0; width:100%; max-height:62%;
      border-radius:16px 16px 0 0; box-shadow:0 -8px 30px rgba(22,36,30,.2); }
    .rd-hint { display:none; }
  }
  @media (prefers-reduced-motion:reduce) { .rd-edge { transition:none; } }
</style>
</head>
<body style="margin:0;background:#fff;padding:16px;">

<div class="rd-wrap" id="rd">
  <div class="rd-head">
    <div>
      <h2>El parche posible</h2>
      <p id="rd-sub">Cargando la hoja…</p>
    </div>
    <button class="rd-chip" id="rd-avisos-btn" aria-pressed="false" hidden>Revisar datos</button>
  </div>

  <div class="rd-bar">
    <input id="rd-q" type="search" placeholder="Buscar nombre o tema…" aria-label="Buscar nombre o tema">
    <button class="rd-chip" data-f="personas" aria-pressed="false">Solo personas</button>
    <button class="rd-chip" data-f="pendientes" aria-pressed="false">Por contactar</button>
    <button class="rd-chip" id="rd-reset">Reacomodar</button>
    <button class="rd-chip" id="rd-png">Descargar imagen</button>
    <button class="rd-chip" id="rd-guardar">Guardar acomodo</button>
  </div>

  <div class="rd-medio">
  <div class="rd-stage" id="rd-stage">
    <svg id="rd-svg" role="img" aria-label="Mapa de conexiones de la red"></svg>
    <div class="rd-estado" id="rd-estado"><span>Cargando…</span></div>
    <div class="rd-hint">Arrastra para mover · dos dedos para acercar/alejar</div>
    <div class="rd-panel" id="rd-panel" role="dialog" aria-label="Detalle">
      <button class="rd-close" id="rd-close" aria-label="Cerrar">×</button>
      <div id="rd-panel-body"></div>
    </div>
  </div>

  <aside class="rd-nube" id="rd-nube">
    <div class="rd-nube-cab" id="rd-nube-cab">
      <h3>Palabras clave <span class="rd-plega">▾</span></h3>
      <button id="rd-nube-limpiar" hidden>Quitar filtro</button>
    </div>
    <div class="rd-nube-lista" id="rd-nube-lista"></div>
  </aside>
  </div>

  <div class="rd-foot">
    <span class="rd-key"><i class="rd-dot"></i>Persona interesada</span>
    <span class="rd-key"><i class="rd-dot rd-hollow"></i>Por contactar</span>
    <span class="rd-key"><i class="rd-box"></i>Colectivo, proyecto u organización</span>
    <span class="rd-key"><i class="rd-box rd-ac"></i>Universidad</span>
    <span class="rd-key"><i class="rd-sw" style="border-color:#0F7B5A"></i>Compañía</span>
    <span class="rd-key"><i class="rd-sw" style="border-color:#0F7B5A;border-top-style:dotted"></i>Parche</span>
    <span class="rd-key"><i class="rd-sw" style="border-color:#C9500F"></i>Líder</span>
    <span class="rd-key"><i class="rd-sw" style="border-color:#C9500F;border-top-style:dashed"></i>Socio</span>
    <span class="rd-key"><i class="rd-sw" style="border-color:#2D5FA8;border-top-style:dotted"></i>Miembro</span>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* ================= CONFIGURACIÓN ================= */
  // Si lo dejás vacío, el mapa te pide la URL la primera vez y la recuerda.
  // Para publicar en WordPress conviene pegarla acá.
  var API = "https://script.google.com/macros/s/AKfycbwwUTy3Q_1Z37O5mT99vQnkdXVXkk5Zo9fzcHVkbl-gd0J_ckhlwBfHRW3ki2MNnaWr/exec";

  var TITULO = "El parche posible";

  // Acomodo fijo. Se pega acá con el botón "Guardar acomodo".
  // Vacío ({}) = el mapa se acomoda solo.
  var POSICIONES = {"boris-teran":[521,437],"alejando-araque":[696,742],"felipe-rodriguez":[555,846],"adrian-acosta":[1145,823],"laura-melo":[650,412],"miguel-mejia":[772,564],"hugo-chavez":[328,869],"nate-looker":[-13,621],"paulo-landa":[137,854],"esteban-rey":[261,629],"paula-falla":[603,538],"juan-carlos-munoz":[526,599],"teatro-lit":[36,963],"nodos-cacharreo-lab":[855,865],"nodo-duitama":[572,335],"creatv":[138,708],"sindicato-audiovisual":[485,1024],"unal":[884,978],"u-javeriana":[1055,722],"u-compensar":[981,639],"u-stanford":[-147,559],"soil-life-suelo-y-vida":[78,517],"monstra":[292,515]};
  /* ================================================= */

  var PAPEL = "#E9EDE4", PAPEL_ALT = "#DFE5D8", TINTA = "#16241E", SUAVE = "#5C6B5F",
      VERDE = "#0F7B5A", NARANJA = "#C9500F", AZUL = "#2D5FA8", ENLACE = "#1A0DAB",
      TIPO = 'Poppins, "Helvetica Neue", Helvetica, Arial, sans-serif';

  var ESTILO = {
    "Compañía": { color:VERDE,   w:5.0, dash:"" },
    "Parche":   { color:VERDE,   w:2.6, dash:"1.5 7" },
    "Líder":    { color:NARANJA, w:4.4, dash:"" },
    "Socio":    { color:NARANJA, w:2.6, dash:"9 6" },
    "Miembro":  { color:AZUL,    w:2.2, dash:"1.5 5" }
  };
  var GLOSA = { "Compañía":"trabajan juntas", "Parche":"cercanía", "Líder":"dirige",
                "Socio":"alianza", "Miembro":"estudia o enseña ahí" };
  function estiloDe(t) { return ESTILO[t] || { color:SUAVE, w:2.4, dash:"4 5" }; }

  var BW = 1500, BH = 1100, NS = "http://www.w3.org/2000/svg";
  var VB = { x:0, y:0, w:BW, h:BH }, filaSueltos = null;
  var svg = q("rd-svg"), stage = q("rd-stage"), panel = q("rd-panel"),
      cuerpoPanel = q("rd-panel-body"), cartel = q("rd-estado");
  function q(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) {
    return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }

  var nodos = [], enlaces = [], vecinos = {}, avisos = [], raiz, gEnlaces, gNodos;

  /* ------- acomodo recordado -------
     Dos capas: POSICIONES (en el archivo, la ve todo el mundo) y el borrador
     que guarda este navegador mientras arrastrás. El borrador manda. */

  var LLAVE = "rd-acomodo";

  function borrador() {
    try { return JSON.parse(localStorage.getItem(LLAVE)) || {}; } catch (err) { return {}; }
  }
  function guardarBorrador() {
    var d = {};
    nodos.forEach(function (n) { d[n.id] = [Math.round(n.x), Math.round(n.y)]; });
    try { localStorage.setItem(LLAVE, JSON.stringify(d)); } catch (err) {}
    q("rd-guardar").textContent = "Guardar acomodo";
  }
  function olvidarBorrador() {
    try { localStorage.removeItem(LLAVE); } catch (err) {}
  }
  function acomodoVigente() {
    var b = borrador(), r = {};
    for (var k in POSICIONES) r[k] = POSICIONES[k];
    for (var j in b) r[j] = b[j];
    return r;
  }

  /* ---------------- carga ---------------- */

  var URL_API = "";

  function cargar() {
    URL_API = API || recordadoAPI();
    if (!URL_API) { pedirAPI(); return; }
    fetch(URL_API, { redirect:"follow" })
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(construir)
      .catch(function () { jsonp(); });   // si el navegador bloquea el CORS
  }

  function jsonp() {
    var nombre = "rdcb" + Date.now();
    var s = document.createElement("script");
    var listo = false;
    window[nombre] = function (datos) { listo = true; limpiar(); construir(datos); };
    function limpiar() { delete window[nombre]; if (s.parentNode) s.parentNode.removeChild(s); }
    s.onerror = function () { limpiar(); noAnduvo(); };
    setTimeout(function () { if (!listo) { limpiar(); noAnduvo(); } }, 20000);
    s.src = URL_API + (URL_API.indexOf("?") === -1 ? "?" : "&") + "callback=" + nombre;
    document.body.appendChild(s);
  }

  /* Si el archivo no trae la URL, se pide una vez y queda guardada en este
     navegador. Pegándola con Ctrl+V no hay forma de equivocarse al transcribir. */

  function recordadoAPI() {
    try { return localStorage.getItem("rd-api") || ""; } catch (err) { return ""; }
  }

  function pedirAPI() {
    cartel.innerHTML =
      "<span><b>Falta conectar la hoja</b>" +
      "Pegá acá la URL que termina en /exec, la que da Apps Script en Implementar." +
      "<span style='display:flex;gap:8px;margin-top:14px'>" +
      "<input id='rd-api-campo' type='url' placeholder='https://script.google.com/macros/s/…/exec' " +
      "style='flex:1;font:inherit;font-size:13px;padding:8px 12px;border-radius:999px;" +
      "border:1.5px solid rgba(22,36,30,.25)'>" +
      "<button id='rd-api-ok' class='rd-chip'>Conectar</button></span></span>";
    cartel.style.display = "flex";
    var campo = q("rd-api-campo");
    campo.focus();
    function aceptar() {
      var v = campo.value.trim();
      if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(v)) {
        campo.style.borderColor = NARANJA;
        campo.focus();
        return;
      }
      try { localStorage.setItem("rd-api", v); } catch (err) {}
      cartel.innerHTML = "<span>Cargando…</span>";
      cargar();
    }
    q("rd-api-ok").addEventListener("click", aceptar);
    campo.addEventListener("keydown", function (ev) { if (ev.key === "Enter") aceptar(); });
  }

  function fallar(titulo, detalle) {
    cartel.innerHTML = "<span><b>" + esc(titulo) + "</b>" + esc(detalle) + "</span>";
    cartel.style.display = "flex";
  }

  function noAnduvo() {
    if (!API && recordadoAPI()) {     // la URL guardada no sirvió: que la pueda corregir
      try { localStorage.removeItem("rd-api"); } catch (err) {}
      pedirAPI();
      q("rd-api-campo").value = URL_API;
      return;
    }
    fallar("No pude leer la hoja.",
      "Revisá que la implementación esté publicada con acceso “Cualquier usuario”.");
  }

  /* ---------------- modelo ---------------- */

  function construir(D) {
    if (D.error) { fallar("El script devolvió un error.", D.error); return; }
    cartel.style.display = "none";
    nodos = []; enlaces = []; vecinos = {};
    avisos = D.avisos || [];
    var porId = {};

    (D.personas || []).forEach(function (p) {
      var n = { id:p.id, clase:"persona", etiqueta:(p.nombre + " " + p.apellido).trim(),
                corto:p.nombre, apellido:p.apellido, estado:p.estado,
                claves:p.claves || [], lugar:"", web:"", grado:0 };
      nodos.push(n); porId[n.id] = n;
    });
    (D.colectivos || []).forEach(function (c) {
      var n = { id:c.id, clase:(c.tipo === "academia" ? "academia" : "colectivo"),
                etiqueta:c.nombre, tipo:c.tipo, lugar:c.lugar || "", web:c.web || "",
                pais:c.pais || "", plataforma:c.plataforma || "", version:c.version || "",
                federado:!!c.federado, claves:c.claves || [], grado:0, lider:false };
      nodos.push(n); porId[n.id] = n;
    });
    if (!nodos.length) { fallar("La hoja no tiene filas.", "Agregá personas o colectivos y recargá."); return; }

    (D.conexiones || []).forEach(function (c) {
      var o = porId[c.a], d = porId[c.b];
      if (!o || !d) return;
      o.grado++; d.grado++;
      if (c.tipo === "Líder") { o.lider = true; d.lider = true; }
      enlaces.push({ o:o, d:d, tipo:c.tipo });
    });

    nodos.forEach(function (n) {
      vecinos[n.id] = [];
      n.r = n.clase === "persona" ? RADIO : 0;
      n.bw = n.clase === "persona" ? 0 : Math.min(n.etiqueta.length, 20) * 11 + 30;
      n.bh = n.clase === "persona" ? 0 : 38;
      n.iconos = n.clase === "persona" ? [] : iconosDe(n);
      n.anchoIconos = anchoFilaIconos(n.iconos);
      n.altoEtiqueta = n.clase === "persona" ? 56 : 10;
    });
    enlaces.forEach(function (e) {
      vecinos[e.o.id].push({ otro:e.d, tipo:e.tipo });
      vecinos[e.d.id].push({ otro:e.o, tipo:e.tipo });
    });

    acomodar();
    dibujar();
    armarNube();
    q("rd-sub").textContent = nodos.filter(function (n) { return n.clase === "persona"; }).length +
      " personas · " + nodos.filter(function (n) { return n.clase !== "persona"; }).length +
      " organizaciones";
    var btn = q("rd-avisos-btn");
    btn.hidden = !avisos.length;
    btn.textContent = "Revisar datos (" + avisos.length + ")";
  }

  /* -------- iconos de las organizaciones -------- */

  var RADIO = 30;   // todas las personas del mismo tamaño

  function iconosDe(n) {
    var lista = [];
    if (n.pais) lista.push({ clase:"pais", texto:n.pais, ancho:32,
                             titulo:n.lugar || n.pais });
    if (n.web) lista.push({ clase:"web", ancho:24,
                            titulo:n.web.replace(/^https?:\/\//, "").replace(/\/$/, "") });
    // la plataforma solo se muestra donde alguien es Líder
    if (n.lider && n.plataforma && n.plataforma !== "-") {
      lista.push({ clase:"plat", texto:n.plataforma, ancho:n.plataforma.length * 7.2 + 16,
                   titulo:n.plataforma + (n.version ? " " + n.version : "") +
                          (n.federado ? " · ya federa" : "") });
    }
    return lista;
  }

  function anchoFilaIconos(lista) {
    if (!lista.length) return 0;
    return lista.reduce(function (a, c) { return a + c.ancho + 6; }, -6);
  }

  /* -------- acomodado automático, determinista -------- */

  function semilla(id) {   // mismo id → misma posición inicial en cada carga
    var h = 2166136261;
    for (var i = 0; i < id.length; i++) { h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
    return ((h >>> 0) % 100000) / 100000;
  }

  function radioColision(n) {
    if (n.clase === "persona") {
      var ancho = Math.max((n.corto || "").length, (n.apellido || "").length) * 6.4;
      return Math.max(n.r + 42, ancho + 12);
    }
    return Math.max(n.bw / 2 + 26, Math.max(n.bh, 38 + (n.iconos && n.iconos.length ? 34 : 0)) / 2 + 20,
                    (n.anchoIconos || 0) / 2 + 18);
  }

  function separar(grupo, vueltas) {
    for (var p = 0; p < vueltas; p++) {
      for (var i = 0; i < grupo.length; i++) {
        for (var j = i + 1; j < grupo.length; j++) {
          var a = grupo[i], b = grupo[j];
          var dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01;
          var min = radioColision(a) + radioColision(b);
          if (d < min) {
            var f = (min - d) / d * 0.25;
            if (a.fijo && b.fijo) continue;
            if (a.fijo)      { b.x += dx * f * 2; b.y += dy * f * 2; }
            else if (b.fijo) { a.x -= dx * f * 2; a.y -= dy * f * 2; }
            else { a.x -= dx * f; a.y -= dy * f; b.x += dx * f; b.y += dy * f; }
          }
        }
      }
    }
  }

  function caja(grupo) {
    var x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    grupo.forEach(function (v) {
      var hw = v.clase === "persona" ? Math.max(v.r, radioColision(v) - 12)
                                     : Math.max(v.bw, v.anchoIconos || 0) / 2;
      var arriba = v.clase === "persona" ? v.r
                  : v.bh / 2 + (v.iconos && v.iconos.length ? 34 : 0);
      x0 = Math.min(x0, v.x - hw); x1 = Math.max(x1, v.x + hw);
      y0 = Math.min(y0, v.y - arriba); y1 = Math.max(y1, v.y + arriba + v.altoEtiqueta);
    });
    return { x0:x0, y0:y0, x1:x1, y1:y1 };
  }

  function acomodar() {
    var conectados = nodos.filter(function (n) { return n.grado > 0; });
    var sueltos = nodos.filter(function (n) { return n.grado === 0; });
    filaSueltos = null;

    // los nodos con posición recordada no se mueven; el resto se acomoda alrededor
    var recordado = acomodoVigente(), hayFijos = false;
    nodos.forEach(function (n) {
      var pos = recordado[n.id];
      n.fijo = !!(pos && isFinite(pos[0]) && isFinite(pos[1]));
      if (n.fijo) { n.x = pos[0]; n.y = pos[1]; hayFijos = true; }
    });

    if (conectados.length) {
      var libres = conectados.filter(function (n) { return !n.fijo; });
      var m = conectados.length;
      var k = Math.sqrt((BW * BH) / Math.max(m, 2));

      libres.forEach(function (nd) {
        // arranca junto a sus vecinos ya ubicados, si los tiene
        var anclas = vecinos[nd.id].filter(function (v) { return v.otro.fijo; });
        var ang = semilla(nd.id) * Math.PI * 2;
        if (anclas.length) {
          var sx = 0, sy = 0;
          anclas.forEach(function (v) { sx += v.otro.x; sy += v.otro.y; });
          nd.x = sx / anclas.length + Math.cos(ang) * 160;
          nd.y = sy / anclas.length + Math.sin(ang) * 160;
        } else {
          var rad = (0.3 + 0.7 * semilla(nd.id + "r")) * Math.min(BW, BH) / 2;
          nd.x = BW / 2 + Math.cos(ang) * rad;
          nd.y = BH / 2 + Math.sin(ang) * rad;
        }
      });

      if (libres.length) {
        var temp = Math.min(BW, BH) / 8;
        for (var t = 0; t < 500; t++) {
          conectados.forEach(function (v) { v.dx = 0; v.dy = 0; });
          for (var i = 0; i < m; i++) {
            for (var j = i + 1; j < m; j++) {
              var a = conectados[i], b = conectados[j];
              var dx = a.x - b.x, dy = a.y - b.y, d = Math.hypot(dx, dy) || 0.01;
              var f = (k * k) / d;
              a.dx += dx / d * f; a.dy += dy / d * f;
              b.dx -= dx / d * f; b.dy -= dy / d * f;
            }
          }
          enlaces.forEach(function (e) {
            var dx = e.o.x - e.d.x, dy = e.o.y - e.d.y, d = Math.hypot(dx, dy) || 0.01;
            var f = (d * d) / k;
            e.o.dx -= dx / d * f; e.o.dy -= dy / d * f;
            e.d.dx += dx / d * f; e.d.dy += dy / d * f;
          });
          libres.forEach(function (v) {
            v.dx += (BW / 2 - v.x) * 0.004;
            v.dy += (BH / 2 - v.y) * 0.004;
            var d = Math.hypot(v.dx, v.dy) || 0.01;
            var paso = Math.min(d, temp);
            v.x += v.dx / d * paso; v.y += v.dy / d * paso;
          });
          temp *= 0.988;
        }
      }

      // la escala solo se toca si nadie está fijado: si no, movería lo ya acomodado
      if (!hayFijos) {
        var bb = caja(conectados);
        var esc = Math.max(0.2, Math.min(2, Math.min(1400 / Math.max(bb.x1 - bb.x0, 1),
                                                     1000 / Math.max(bb.y1 - bb.y0, 1))));
        var cx = (bb.x0 + bb.x1) / 2, cy = (bb.y0 + bb.y1) / 2;
        conectados.forEach(function (v) { v.x = cx + (v.x - cx) * esc; v.y = cy + (v.y - cy) * esc; });
      }
      separar(conectados, 600);
    }

    // los nodos sin conexiones no participan de las fuerzas: van en una banda aparte
    var porUbicar = sueltos.filter(function (n) { return !n.fijo; });
    if (porUbicar.length) {
      var b = conectados.length ? caja(conectados) : { x0:0, y0:0, x1:BW, y1:0 };
      var anchos = porUbicar.map(function (s2) {
        return s2.clase === "persona" ? radioColision(s2) * 1.7 : s2.bw;
      });
      var maxAncho = Math.max(b.x1 - b.x0, 900);
      var filas = [], actual = [], usado = 0;
      porUbicar.forEach(function (s2, i) {
        if (usado + anchos[i] > maxAncho && actual.length) { filas.push(actual); actual = []; usado = 0; }
        actual.push({ nodo:s2, ancho:anchos[i] });
        usado += anchos[i] + 60;
      });
      if (actual.length) filas.push(actual);

      var y = b.y1 + 120;
      filaSueltos = { x:b.x0, y:y - 54 };
      filas.forEach(function (fila) {
        var anchoFila = fila.reduce(function (a, c) { return a + c.ancho + 60; }, -60);
        var x = (b.x0 + b.x1) / 2 - anchoFila / 2;
        fila.forEach(function (it) {
          it.nodo.x = x + it.ancho / 2;
          it.nodo.y = y;
          x += it.ancho + 60;
        });
        y += 150;
      });
    }

    // el lienzo se adapta al contenido: nunca se aplasta el dibujo para que entre
    var todo = caja(nodos), margen = 70;
    if (filaSueltos) todo.y0 = Math.min(todo.y0, filaSueltos.y - 30);
    VB = { x:todo.x0 - margen, y:todo.y0 - margen,
           w:(todo.x1 - todo.x0) + margen * 2, h:(todo.y1 - todo.y0) + margen * 2 };
  }

  /* ---------------- dibujo ---------------- */

  function crear(tag, attrs) {
    var el = document.createElementNS(NS, tag);
    for (var a in attrs) el.setAttribute(a, attrs[a]);
    return el;
  }

  function dibujar() {
    svg.innerHTML = "";
    svg.setAttribute("viewBox", VB.x + " " + VB.y + " " + VB.w + " " + VB.h);
    svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
    svg.setAttribute("font-family", TIPO);
    raiz = crear("g", {});
    gEnlaces = crear("g", {}); gNodos = crear("g", {});
    raiz.appendChild(gEnlaces); raiz.appendChild(gNodos); svg.appendChild(raiz);

    if (filaSueltos) {
      var rot = crear("text", { x:filaSueltos.x, y:filaSueltos.y, "font-size":22,
                                "font-weight":400, fill:SUAVE });
      rot.textContent = "Todavía sin conexiones anotadas";
      raiz.insertBefore(rot, gEnlaces);
    }

    enlaces.forEach(function (e) {
      var st = estiloDe(e.tipo);
      var attrs = { stroke:st.color, "stroke-width":st.w, "stroke-linecap":"round",
                    opacity:"0.78", "class":"rd-edge" };
      if (st.dash) attrs["stroke-dasharray"] = st.dash;
      e.el = crear("line", attrs);
      gEnlaces.appendChild(e.el);
    });

    nodos.forEach(function (n) {
      var g = crear("g", { "class":"rd-node", tabindex:"0", role:"button", "aria-label":n.etiqueta });
      if (n.clase === "persona") {
        var lleno = n.estado === "Interesado";
        g.appendChild(lleno
          ? crear("circle", { r:n.r, fill:VERDE })
          : crear("circle", { r:n.r, fill:PAPEL, stroke:VERDE, "stroke-width":3, "stroke-dasharray":"6 5" }));
        var ini = crear("text", { "text-anchor":"middle", y:7, "font-size":20,
          "font-weight":600, fill:lleno ? PAPEL : VERDE });
        ini.textContent = (n.corto[0] || "") + (n.apellido[0] || "");
        g.appendChild(ini);
        [[n.corto, n.r + 26, 500], [n.apellido, n.r + 48, 300]].forEach(function (par) {
          if (!par[0]) return;
          // dos textos: primero el contorno del color del papel, después la letra.
          // Así el nombre se lee aunque lo cruce un vínculo, sin depender de paint-order.
          var halo = crear("text", { "text-anchor":"middle", y:par[1], "font-size":22,
            "font-weight":par[2], fill:PAPEL, stroke:PAPEL, "stroke-width":4,
            "stroke-linejoin":"round" });
          halo.textContent = par[0];
          g.appendChild(halo);
          var t = crear("text", { "text-anchor":"middle", y:par[1], "font-size":22,
            "font-weight":par[2], fill:TINTA });
          t.textContent = par[0];
          g.appendChild(t);
        });
      } else {
        var col = n.clase === "academia" ? AZUL : NARANJA;
        g.appendChild(crear("rect", { x:-n.bw / 2, y:-n.bh / 2, width:n.bw, height:n.bh,
          rx:8, fill:PAPEL, stroke:col, "stroke-width":3 }));
        var t2 = crear("text", { "text-anchor":"middle", y:8, "font-size":21, "font-weight":500, fill:col });
        t2.textContent = n.etiqueta.length > 21 ? n.etiqueta.slice(0, 20) + "…" : n.etiqueta;
        g.appendChild(t2);
        if (n.iconos.length) g.appendChild(filaIconos(n, col));
      }
      n.el = g; gNodos.appendChild(g);
    });
    pintar();
  }

  /** Pastilla de país, enlace al sitio y, donde alguien lidera, la plataforma. */
  function filaIconos(n, col) {
    var fila = crear("g", { transform:"translate(0," + (-n.bh / 2 - 31) + ")" });
    var x = -n.anchoIconos / 2;
    n.iconos.forEach(function (ico) {
      var g = crear("g", { transform:"translate(" + x + ",0)" });
      var rotulo = crear("title", {});
      rotulo.textContent = ico.titulo;
      g.appendChild(rotulo);

      if (ico.clase === "web") {
        g.setAttribute("class", "rd-web");
        g.setAttribute("data-web", n.web);
        g.appendChild(crear("rect", { x:0, y:0, width:ico.ancho, height:22, rx:6,
          fill:"transparent", stroke:ENLACE, "stroke-width":1.6 }));
        var cx = ico.ancho / 2;
        g.appendChild(crear("circle", { cx:cx, cy:11, r:6.4, fill:"none",
          stroke:ENLACE, "stroke-width":1.5 }));
        g.appendChild(crear("ellipse", { cx:cx, cy:11, rx:2.9, ry:6.4, fill:"none",
          stroke:ENLACE, "stroke-width":1.3 }));
        g.appendChild(crear("line", { x1:cx - 6.4, y1:11, x2:cx + 6.4, y2:11,
          stroke:ENLACE, "stroke-width":1.3 }));
      } else {
        var relleno = ico.clase === "plat" ? col : "transparent";
        g.appendChild(crear("rect", { x:0, y:0, width:ico.ancho, height:22, rx:6,
          fill:relleno, stroke:col, "stroke-width":1.6,
          opacity:ico.clase === "plat" ? "0.92" : "0.85" }));
        var t = crear("text", { x:ico.ancho / 2, y:15, "text-anchor":"middle",
          "font-size":ico.clase === "pais" ? 13 : 12, "font-weight":500,
          fill:ico.clase === "plat" ? PAPEL : col });
        t.textContent = ico.texto;
        g.appendChild(t);
      }
      fila.appendChild(g);
      x += ico.ancho + 6;
    });
    return fila;
  }

  function recorte(n, ux, uy) {
    if (n.clase === "persona") return n.r + 4;
    var hw = n.bw / 2 + 5, hh = n.bh / 2 + 5;
    return Math.min(ux ? hw / Math.abs(ux) : 1e9, uy ? hh / Math.abs(uy) : 1e9);
  }

  function pintar() {
    enlaces.forEach(function (e) {
      var dx = e.d.x - e.o.x, dy = e.d.y - e.o.y, L = Math.hypot(dx, dy) || 1;
      var ux = dx / L, uy = dy / L;
      e.el.setAttribute("x1", e.o.x + ux * recorte(e.o, ux, uy));
      e.el.setAttribute("y1", e.o.y + uy * recorte(e.o, ux, uy));
      e.el.setAttribute("x2", e.d.x - ux * recorte(e.d, -ux, -uy));
      e.el.setAttribute("y2", e.d.y - uy * recorte(e.d, -ux, -uy));
    });
    nodos.forEach(function (n) { n.el.setAttribute("transform", "translate(" + n.x + "," + n.y + ")"); });
  }

  /* ---------------- interacción ---------------- */

    }
    var cerca = {}; cerca[n.id] = 1;
    vecinos[n.id].forEach(function (v) { cerca[v.otro.id] = 1; });
    nodos.forEach(function (m) { m.el.classList.toggle("rd-fade", !cerca[m.id]); });
    enlaces.forEach(function (e) { e.el.classList.toggle("rd-fade", e.o.id !== n.id && e.d.id !== n.id); });

  /* ---------------- nube de temas ---------------- */

  var temas = [];

  function armarNube() {
    var cuenta = {};
    nodos.forEach(function (n) {
      n.claves.forEach(function (k) {
        var kk = k.trim();
        if (kk) cuenta[kk] = (cuenta[kk] || 0) + 1;
      });
    });
    var lista = Object.keys(cuenta).sort(function (a, b) {
      return cuenta[b] - cuenta[a] || a.localeCompare(b, "es");
    });
    var tope = lista.length ? cuenta[lista[0]] : 1;

    var caja = q("rd-nube-lista");
    caja.innerHTML = "";
    lista.forEach(function (k) {
      var b = document.createElement("button");
      b.className = "rd-tema";
      b.type = "button";
      b.dataset.t = k;
      b.setAttribute("aria-pressed", "false");
      // el tamaño dice cuánta gente comparte el tema
      b.style.fontSize = (11.5 + (cuenta[k] - 1) / Math.max(tope - 1, 1) * 8).toFixed(1) + "px";
      b.textContent = k;
      b.title = cuenta[k] + (cuenta[k] === 1 ? " ficha" : " fichas");
      caja.appendChild(b);
    });

  /* ---------------- pan, zoom, arrastre ---------------- */

  var vista = { x:0, y:0, k:1 };
  function aplicarVista() {

  }
  function aCoordSvg(ev) {
    var r = svg.getBoundingClientRect();
    var e = Math.max(VB.w / r.width, VB.h / r.height);
    return { x:VB.x + (ev.clientX - r.left) * e - (r.width * e - VB.w) / 2,
             y:VB.y + (ev.clientY - r.top) * e - (r.height * e - VB.h) / 2 };
  }

  var arrastrando = null, mueveLienzo = false, ini = null, movido = 0;

  stage.addEventListener("pointerdown", function (ev) {
    if (!raiz) return;
    if (ev.target.closest && ev.target.closest(".rd-web")) { movido = 0; return; }
    var g = ev.target.closest ? ev.target.closest(".rd-node") : null;
    movido = 0;
    if (g) {
      var p = aCoordSvg(ev);
      arrastrando = nodos.filter(function (n) { return n.el === g; })[0];
      ini = { px:p.x, py:p.y, nx:arrastrando.x, ny:arrastrando.y };
    } else {
      mueveLienzo = true; stage.classList.add("rd-drag");
      ini = { cx:ev.clientX, cy:ev.clientY, vx:vista.x, vy:vista.y };
    }
    stage.setPointerCapture(ev.pointerId);
  });

  stage.addEventListener("pointermove", function (ev) {
    if (arrastrando) {
      var p = aCoordSvg(ev);
      movido += Math.abs(p.x - ini.px) + Math.abs(p.y - ini.py);
      arrastrando.x = ini.nx + (p.x - ini.px) / vista.k;
      arrastrando.y = ini.ny + (p.y - ini.py) / vista.k;
      pintar();
    } else if (mueveLienzo) {
      movido += Math.abs(ev.clientX - ini.cx) + Math.abs(ev.clientY - ini.cy);
      vista.x = ini.vx + (ev.clientX - ini.cx);
      vista.y = ini.vy + (ev.clientY - ini.cy);
      aplicarVista();
    }
  });

  stage.addEventListener("pointerup", function (ev) {
    var enlace = ev.target.closest ? ev.target.closest(".rd-web") : null;
    if (enlace && movido < 12) {
      window.open(enlace.getAttribute("data-web"), "_blank", "noopener");
      arrastrando = null; mueveLienzo = false; stage.classList.remove("rd-drag");
      return;
    }
    var g = ev.target.closest ? ev.target.closest(".rd-node") : null;
    if (g && movido < 12) {
      var n = nodos.filter(function (m) { return m.el === g; })[0];
      destacar(activo === n ? null : n);
    } else if (!g && mueveLienzo && movido < 8) {
      destacar(null);
    }
    if (arrastrando && movido >= 12) guardarBorrador();
    arrastrando = null; mueveLienzo = false; stage.classList.remove("rd-drag");
  });

  stage.addEventListener("wheel", function (ev) {
    if (!raiz) return;
    ev.preventDefault();
    var caja = stage.getBoundingClientRect();
    var mx = ev.clientX - caja.left, my = ev.clientY - caja.top;
    var k2 = Math.max(0.45, Math.min(3.2, vista.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    var real = k2 / vista.k;
    vista.x = mx - (mx - vista.x) * real;
    vista.y = my - (my - vista.y) * real;
    vista.k = k2;
    aplicarVista();
  }, { passive:false });

  var toques = {};
  stage.addEventListener("touchstart", function (ev) {
    if (ev.touches.length === 2) { toques.d = dist(ev.touches[0], ev.touches[1]); toques.k = vista.k; }
  }, { passive:true });
  stage.addEventListener("touchmove", function (ev) {
    if (ev.touches.length === 2 && toques.d) {
      ev.preventDefault();
      vista.k = Math.max(0.45, Math.min(3.2, toques.k * dist(ev.touches[0], ev.touches[1]) / toques.d));
      aplicarVista();
    }
  }, { passive:false });
  stage.addEventListener("touchend", function () { toques = {}; }, { passive:true });
  function dist(a, b) { return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY); }

  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape") destacar(null);
    if ((ev.key === "Enter" || ev.key === " ") && ev.target.closest && ev.target.closest(".rd-node")) {
      ev.preventDefault();
      var g = ev.target.closest(".rd-node");
      var n = nodos.filter(function (m) { return m.el === g; })[0];
      destacar(activo === n ? null : n);
    }
  });

  /* ---------------- descarga PNG para WhatsApp ---------------- */

  function leyendaSVG(ancho, y) {
    var g = crear("g", {});
    g.appendChild(crear("rect", { x:60, y:y, width:ancho - 120, height:250, rx:14, fill:PAPEL_ALT }));
    var formas = [["lleno", VERDE, "Persona ya interesada"], ["hueco", VERDE, "Persona por contactar"],
                  ["caja", NARANJA, "Colectivo, proyecto u organización"], ["caja", AZUL, "Universidad"]];
    formas.forEach(function (f, i) {
      var yy = y + 44 + i * 50;
      if (f[0] === "lleno") g.appendChild(crear("circle", { cx:100, cy:yy, r:15, fill:f[1] }));
      else if (f[0] === "hueco") g.appendChild(crear("circle", { cx:100, cy:yy, r:15, fill:"none",
        stroke:f[1], "stroke-width":3, "stroke-dasharray":"6 5" }));
      else g.appendChild(crear("rect", { x:83, y:yy - 13, width:34, height:26, rx:6, fill:"none",
        stroke:f[1], "stroke-width":3 }));
      var t = crear("text", { x:132, y:yy + 8, "font-size":22, "font-weight":300, fill:TINTA });
      t.textContent = f[2]; g.appendChild(t);
    });
    var cols = [[ancho * 0.36, ["Compañía", "Parche"]],
                [ancho * 0.65, ["Líder", "Socio", "Miembro"]]];
    cols.forEach(function (c) {
      c[1].forEach(function (nombre, i) {
        var st = estiloDe(nombre), yy = y + 40 + i * 70;
        var attrs = { x1:c[0], y1:yy, x2:c[0] + 64, y2:yy, stroke:st.color,
                      "stroke-width":st.w, "stroke-linecap":"round" };
        if (st.dash) attrs["stroke-dasharray"] = st.dash;
        g.appendChild(crear("line", attrs));
        var t1 = crear("text", { x:c[0] + 82, y:yy + 2, "font-size":22, "font-weight":500, fill:TINTA });
        t1.textContent = nombre; g.appendChild(t1);
        var t2 = crear("text", { x:c[0] + 82, y:yy + 27, "font-size":20, "font-weight":300, fill:SUAVE });
        t2.textContent = GLOSA[nombre] || ""; g.appendChild(t2);
      });
    });
    return g;
  }

  function descargarPNG() {
    if (!nodos.length) return;
    var ANCHO = Math.max(VB.w, 1400);
    var CAB = 170, LEY = 290, ALTO = CAB + VB.h + LEY;
    var fuera = crear("svg", { xmlns:NS, width:ANCHO, height:ALTO,
                               viewBox:"0 0 " + ANCHO + " " + ALTO, "font-family":TIPO });
    fuera.appendChild(crear("rect", { width:ANCHO, height:ALTO, fill:PAPEL }));

    var t1 = crear("text", { x:60, y:100, "font-size":54, "font-weight":600,
                             fill:TINTA, "letter-spacing":"-1.2" });
    t1.textContent = TITULO; fuera.appendChild(t1);
    var t2 = crear("text", { x:60, y:140, "font-size":24, "font-weight":300, fill:SUAVE });
    t2.textContent = q("rd-sub").textContent + " · " + new Date().toLocaleDateString("es");
    fuera.appendChild(t2);

    var copia = raiz.cloneNode(true);
    copia.removeAttribute("transform");
    Array.prototype.forEach.call(copia.querySelectorAll(".rd-fade"), function (el) {
      el.setAttribute("opacity", "0.13"); });
    var envoltorio = crear("g", { transform:"translate(" +
      ((ANCHO - VB.w) / 2 - VB.x) + "," + (CAB - VB.y) + ")" });
    envoltorio.appendChild(copia);
    fuera.appendChild(envoltorio);
    fuera.appendChild(leyendaSVG(ANCHO, CAB + VB.h + 20));

    var texto = new XMLSerializer().serializeToString(fuera);
    var url = URL.createObjectURL(new Blob([texto], { type:"image/svg+xml;charset=utf-8" }));
    var img = new Image();
    img.onload = function () {
      var escala = Math.min(2, 2600 / ANCHO);
      var lienzo = document.createElement("canvas");
      lienzo.width = Math.round(ANCHO * escala); lienzo.height = Math.round(ALTO * escala);
      var ctx = lienzo.getContext("2d");
      ctx.fillStyle = PAPEL; ctx.fillRect(0, 0, lienzo.width, lienzo.height);
      ctx.drawImage(img, 0, 0, lienzo.width, lienzo.height);
      URL.revokeObjectURL(url);
      lienzo.toBlob(function (blob) {
        var a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "mapa-red.png";
        a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
      }, "image/png");
    };
    img.onerror = function () { URL.revokeObjectURL(url); alert("No pude generar la imagen en este navegador."); };
    img.src = url;
  }

  q("rd-png").addEventListener("click", descargarPNG);

  cargar();
})();
</script>
